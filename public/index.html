<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JSK Stream Gallery</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: var(--bg);
      color: var(--text);
      transition: background 0.3s, color 0.3s;
    }
    :root {
      --bg: #121212;
      --text: white;
    }
    body.light {
      --bg: #f1f1f1;
      --text: #111;
    }
    h1 {
      text-align: center;
      color: #ff3c00;
      margin: 20px;
    }
    .toolbar {
      text-align: center;
      margin-bottom: 10px;
    }
    .toolbar input {
      padding: 10px;
      width: 200px;
      border-radius: 6px;
      border: none;
      outline: none;
    }
    .toggle {
      display: inline-block;
      margin-left: 20px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #ff3c00;
      cursor: pointer;
    }
    #gallery {
      max-width: 600px;
      margin: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .card {
      background: #222;
      border-radius: 10px;
      padding: 10px;
      text-align: center;
    }
    body.light .card {
      background: #eee;
    }
    .card img {
      width: 100%;
      border-radius: 8px;
    }
    .card a {
      display: inline-block;
      margin-top: 10px;
      padding: 10px 20px;
      color: #ff3c00;
      border: 2px solid #ff3c00;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
    }
    .pagination {
      text-align: center;
      margin: 20px;
    }
    .pagination button {
      padding: 8px 16px;
      font-size: 14px;
      margin: 0 10px;
      background: #ff3c00;
      border: none;
      color: white;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>JSK 18+ Viewer</h1>
  <div class="toolbar">
    <input type="text" id="searchInput" placeholder="Search..." />
    <div class="toggle" onclick="toggleTheme()"></div>
  </div>

  <div id="gallery"></div>

  <div class="pagination">
    <button onclick="prevPage()">Previous</button>
    <span id="pageInfo">Page 1</span>
    <button onclick="nextPage()">Next</button>
  </div>

  <script>
    let currentPage = 1;
    let currentQuery = "milf";

    function toggleTheme() {
      document.body.classList.toggle("light");
    }

    async function loadVideos() {
      const res = await fetch(`/api/search?q=${encodeURIComponent(currentQuery)}&page=${currentPage}`);
      const data = await res.json();
      const gallery = document.getElementById("gallery");
      document.getElementById("pageInfo").textContent = `Page ${currentPage}`;
      gallery.innerHTML = "";

      data.forEach(v => {
        const card = document.createElement("div");
        card.className = "card";

        const img = document.createElement("img");
        img.src = `/proxy?url=${encodeURIComponent(v.thumbnail)}&type=thumbnail`;

        const link = document.createElement("a");
        link.href = `player.html?video=${encodeURIComponent(v.video)}&poster=${encodeURIComponent(v.thumbnail)}`;
        link.textContent = "▶ Play";

        card.appendChild(img);
        card.appendChild(link);
        gallery.appendChild(card);
      });
    }

    function nextPage() {
      currentPage++;
      loadVideos();
    }

    function prevPage() {
      if (currentPage > 1) {
        currentPage--;
        loadVideos();
      }
    }

    document.getElementById("searchInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        currentQuery = e.target.value.trim() || "milf";
        currentPage = 1;
        loadVideos();
      }
    });

    loadVideos();
  </script>
</body>
</html>
